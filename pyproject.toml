[project]
name = "ovfdb"
version = "0.0.1"
description = "OpenVideoFDB: an open benchmark harness for full-duplex audio-visual conversational agents (reimplementation of VideoFDB, arXiv 2605.30256)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.13",
    "av>=12",
    "pillow>=10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "google-genai>=1.0",
    "openai>=1.40",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "websockets>=12",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
avatar = ["playwright>=1.45"]
review = ["streamlit>=1.36"]
lanes = ["mediapipe>=0.10", "opencv-python>=4.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ovfdb = "ovfdb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ovfdb"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
markers = ["network: needs internet access"]
asyncio_mode = "auto"
